<!DOCTYPE html>
<html lang="en">
<head>
<!-- VAULT playable - META build. Single self-contained HTML, no external requests. CTA fires FbPlayableAd.onCTAClick(); store link is configured in Ads Manager. -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#05070f">
<title>VAULT — playable</title>
<style>
:root{color-scheme:dark;
  --ink:#05070f; --panel:#141b30; --steel:#8b94a8; --gold:#f2b134; --gold-hi:#ffe08a;
  --toxic:#4fe04a; --text:#e8ecf5; --dim:#8b93ab;}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--ink);color:var(--text);
  font-family:'Space Grotesk',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none}
canvas{position:fixed;inset:0;display:block;width:100%;height:100%}
button{font:inherit;cursor:pointer}

/* HUD */
#hud{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;justify-content:space-between;align-items:center;
  padding:calc(12px + env(safe-area-inset-top)) 16px 0}
#logo{font-weight:700;font-size:14px;letter-spacing:.42em;text-indent:.42em;color:var(--text);
  text-shadow:0 0 18px rgba(242,177,52,.25)}
#getBtn{background:linear-gradient(180deg,var(--gold-hi),var(--gold));color:#241804;font-weight:700;
  font-size:13px;letter-spacing:.06em;padding:9px 20px;border-radius:999px;border:0;
  box-shadow:0 4px 18px rgba(242,177,52,.35),inset 0 1px 0 rgba(255,255,255,.5)}
#dots{position:fixed;left:0;right:0;top:calc(52px + env(safe-area-inset-top));z-index:5;
  display:flex;justify-content:center;gap:7px;pointer-events:none}
#dots i{width:6px;height:6px;border-radius:50%;background:#2c3552;transition:background .3s,box-shadow .3s}
#dots i.on{background:var(--gold);box-shadow:0 0 10px rgba(242,177,52,.7)}

/* banner */
#banner{position:fixed;left:50%;top:calc(84px + env(safe-area-inset-top));transform:translate(-50%,-8px);
  z-index:6;background:rgba(10,14,28,.78);border:1px solid rgba(255,255,255,.12);border-radius:999px;
  padding:9px 20px;font-size:14px;font-weight:500;letter-spacing:.02em;opacity:0;pointer-events:none;
  transition:opacity .28s,transform .28s;backdrop-filter:blur(8px);white-space:nowrap}
#banner.show{opacity:1;transform:translate(-50%,0)}
#banner.bad{border-color:rgba(255,110,110,.4);color:#ffb3b3}

/* splash */
#splash{position:fixed;inset:0;z-index:8;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:14px;background:var(--ink);transition:opacity .45s}
#splash h1{font-size:46px;font-weight:700;letter-spacing:.5em;text-indent:.5em;
  animation:track 1.1s cubic-bezier(.2,.8,.2,1) both;text-shadow:0 0 40px rgba(242,177,52,.3)}
#splash .rule{width:0;height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent);
  animation:rule 1s .15s cubic-bezier(.2,.8,.2,1) both}
#splash p{font-size:14px;color:var(--dim);letter-spacing:.04em;animation:fadeUp .7s .4s both}
#splash.hide{opacity:0;pointer-events:none}
@keyframes track{from{letter-spacing:1.1em;opacity:0}to{letter-spacing:.5em;opacity:1}}
@keyframes rule{from{width:0}to{width:190px}}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* end card */
#end{position:fixed;inset:0;z-index:7;display:none;flex-direction:column;align-items:center;justify-content:center;
  gap:10px;text-align:center;padding:30px;background:rgba(4,6,14,.72);backdrop-filter:blur(10px)}
#end h2{font-size:34px;font-weight:700;letter-spacing:.02em}
#end .sub{font-size:15px;color:var(--dim);max-width:270px;line-height:1.5}
#ctaBtn{margin-top:22px;width:min(300px,84vw);padding:17px 20px;border:0;border-radius:16px;
  font-size:18px;font-weight:700;letter-spacing:.04em;color:#241804;
  background:linear-gradient(180deg,var(--gold-hi),var(--gold));
  box-shadow:0 10px 34px rgba(242,177,52,.4),inset 0 1px 0 rgba(255,255,255,.55);
  animation:pulse 1.6s ease-in-out infinite}
#again{margin-top:6px;background:none;border:0;color:var(--dim);font-size:14px;font-weight:500;
  padding:10px;text-decoration:underline;text-underline-offset:3px}
#credit{position:absolute;bottom:calc(18px + env(safe-area-inset-bottom));font-size:11px;color:#4d5570;letter-spacing:.04em}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.045)}}
@media (prefers-reduced-motion:reduce){#ctaBtn,#splash h1,#splash .rule,#splash p{animation:none}}

/* toast */
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,16px);
  z-index:9;width:min(350px,90vw);background:rgba(14,19,38,.97);border:1px solid rgba(255,255,255,.14);
  border-radius:14px;padding:13px 16px;font-size:12.5px;line-height:1.55;color:var(--dim);opacity:0;
  pointer-events:none;transition:opacity .25s,transform .25s;box-shadow:0 14px 44px rgba(0,0,0,.55);text-align:left}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast b{color:var(--text)}
#toast code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11px;color:var(--gold);
  background:rgba(242,177,52,.1);padding:1px 5px;border-radius:5px}
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="hud">
  <div id="logo">VAULT</div>
  <button id="getBtn">GET</button>
</div>
<div id="dots"><i class="on"></i><i></i></div>
<div id="banner"></div>

<div id="splash">
  <h1>VAULT</h1>
  <div class="rule"></div>
  <p>pull the pins, free the gold</p>
</div>

<div id="end">
  <h2>Vault cracked.</h2>
  <div class="sub">Every vault has one clean pull. 500+ heists are waiting for yours.</div>
  <button id="ctaBtn">Install free</button>
  <button id="again">Run it again</button>
  <div id="credit">playable concept — Luka Skhiladze</div>
</div>

<div id="toast"></div>

<script>
"use strict";
var STORE_URL="https://example.com/REPLACE-WITH-STORE-URL";
/* ============ setup ============ */
var cv=document.getElementById('cv'), ctx=cv.getContext('2d');
var $=function(id){return document.getElementById(id)};
var VW=360, VH=640;
var W=0,H=0,DPR=1,SC=1,OX=0,OY=0,vig=null;

function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  W=window.innerWidth; H=window.innerHeight;
  cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  SC=Math.min(W/VW,H/VH); OX=(W-VW*SC)/2; OY=(H-VH*SC)/2;
  vig=document.createElement('canvas'); vig.width=W; vig.height=H;
  var vc=vig.getContext('2d');
  var g=vc.createRadialGradient(W/2,H*.45,Math.min(W,H)*.35,W/2,H*.5,Math.max(W,H)*.78);
  g.addColorStop(0,'rgba(0,0,0,0)'); g.addColorStop(1,'rgba(0,0,0,.55)');
  vc.fillStyle=g; vc.fillRect(0,0,W,H);
}
window.addEventListener('resize',resize); resize();

function toWorld(px,py){return {x:(px-OX)/SC, y:(py-OY)/SC};}

/* ============ audio (procedural, no assets) ============ */
var AC=null;
function initAudio(){ if(AC) return;
  try{ AC=new (window.AudioContext||window.webkitAudioContext)();
       if(AC.state==='suspended') AC.resume(); }catch(e){ AC=null; } }
function tone(f,dur,type,vol,slide){
  try{ if(!AC) return;
    var o=AC.createOscillator(), g=AC.createGain(), t=AC.currentTime;
    o.type=type||'sine'; o.frequency.setValueAtTime(f,t);
    if(slide) o.frequency.exponentialRampToValueAtTime(slide,t+dur);
    g.gain.setValueAtTime(vol||.06,t);
    g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+dur);
  }catch(e){}
}
var lastBlip=0;
function collectSnd(n){ var now=performance.now(); if(now-lastBlip<38) return; lastBlip=now;
  tone(480+Math.min(n*4,700),.07,'sine',.045); }
function pinSnd(){ tone(1250,.09,'triangle',.08); tone(1870,.05,'triangle',.035); }
function springSnd(){ tone(300,.07,'sine',.035); }
function failSnd(){ tone(210,.55,'sawtooth',.06,66); }
function winSnd(){ var seq=[523,659,784,1046];
  for(var i=0;i<seq.length;i++)(function(f,d){ setTimeout(function(){tone(f,.16,'sine',.06)},d); })(seq[i],i*95); }

/* ============ helpers ============ */
function clamp(v,a,b){return v<a?a:(v>b?b:v);}
function lerp(a,b,t){return a+(b-a)*t;}
function hexLerp(h1,h2,t){
  var a=parseInt(h1.slice(1),16), b=parseInt(h2.slice(1),16);
  var r=Math.round(lerp(a>>16&255,b>>16&255,t)),
      g=Math.round(lerp(a>>8&255,b>>8&255,t)),
      bl=Math.round(lerp(a&255,b&255,t));
  return 'rgb('+r+','+g+','+bl+')';
}
function rr(c,x,y,w,h,r){ c.beginPath();
  c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r);
  c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath(); }

/* ============ particle sprites (pre-rendered glow dots) ============ */
function makeDot(cIn,cMid,glow){
  var c=document.createElement('canvas'); c.width=28; c.height=28;
  var g2=c.getContext('2d');
  var gr=g2.createRadialGradient(14,14,0,14,14,14);
  gr.addColorStop(0,cIn); gr.addColorStop(.34,cMid);
  gr.addColorStop(.55,glow); gr.addColorStop(1,'rgba(0,0,0,0)');
  g2.fillStyle=gr; g2.fillRect(0,0,28,28); return c;
}
var SPR_GOLD=[], SPR_SLIME;
(function(){
  for(var i=0;i<=5;i++){ var t=i/5;
    SPR_GOLD.push(makeDot(hexLerp('#fff3c4','#d8ffd0',t),
                          hexLerp('#f6b234','#4fe04a',t),
                          'rgba('+Math.round(lerp(246,79,t))+','+Math.round(lerp(178,224,t))+','+Math.round(lerp(52,74,t))+',.4)'));
  }
  SPR_SLIME=makeDot('#d8ffd0','#4fe04a','rgba(79,224,74,.4)');
})();

/* ============ world state ============ */
var mode='splash', li=0, phase='idle';
var P=[], FX=[], walls=[], pins=[];
var goldTotal=0, collected=0, winNeed=0;
var TS=1, tsTarget=1, shake=0, vignRed=0;
var lastInteract=performance.now(), contamCheck=0;
var G=1500, WALLT=4.5, PINT=5.5;

/* dust motes (screen space ambience) */
var motes=[]; for(var mi=0;mi<26;mi++)
  motes.push({x:Math.random(),y:Math.random(),r:.6+Math.random()*1.6,s:4+Math.random()*10,p:Math.random()*6.28});

function seg(ax,ay,bx,by){return {ax:ax,ay:ay,bx:bx,by:by};}
function mkpin(ax,ay,bx,by){
  var dx=bx-ax, dy=by-ay, L=Math.sqrt(dx*dx+dy*dy);
  return {ax:ax,ay:ay,bx:bx,by:by,len:L,dx:dx/L,dy:dy/L,
          off:0,state:'in',active:true,hint:false,grab:false,t0:0,from:0};
}
function spawnBlock(type,x0,x1,y0,y1,sp){
  var cols=Math.floor((x1-x0)/sp)+1, rows=Math.floor((y1-y0)/sp)+1, n=0;
  for(var r=0;r<rows;r++) for(var c=0;c<cols;c++){
    P.push({x:x0+c*sp+(Math.random()-.5)*1.6, y:y0+r*sp+(Math.random()-.5)*1.6,
            vx:0, vy:0, r:2.4+Math.random()*.7, t:type, c:0, dead:false});
    n++;
  }
  return n;
}

var CHEST={x:128,y:554,w:104,h:64};
function baseWalls(){ return [
  seg(140,104,140,548), seg(220,104,220,548),
  seg(140,548,132,557), seg(220,548,228,557),
  seg(130,556,130,616), seg(230,556,230,616), seg(130,616,230,616)
];}

var LEVELS=[
  { build:function(){
      walls=baseWalls();
      pins=[ mkpin(130,260,254,260) ];
      goldTotal=spawnBlock(0,148,212,152,252,6.6);
      pins[0].hint=true;
    },
    banner:'Pull the pin', correct:[0] },
  { build:function(){
      walls=baseWalls();
      pins=[ mkpin(130,212,254,212), mkpin(250,392,106,392) ];
      spawnBlock(1,148,212,150,206,6.6);
      goldTotal=spawnBlock(0,148,212,266,384,6.6);
    },
    banner:'Careful — order matters', correct:[1] }
];

function startLevel(i){
  li=i; P.length=0; FX.length=0; collected=0; contamCheck=0;
  TS=1; tsTarget=1; vignRed=0; phase='run'; mode='play';
  LEVELS[i].build();
  winNeed=Math.ceil(goldTotal*0.7);
  var ds=$('dots').children;
  for(var d=0;d<ds.length;d++) ds[d].className = d<=i ? 'on' : '';
  showBanner(LEVELS[i].banner,false);
  lastInteract=performance.now();
}

/* ============ banners / toast ============ */
var bnT=null;
function showBanner(txt,bad){
  var b=$('banner'); b.textContent=txt;
  b.className='show'+(bad?' bad':'');
  clearTimeout(bnT); bnT=setTimeout(function(){b.className='';},2100);
}
var toastT=null;
function showToast(){
  var t=$('toast');
  t.innerHTML='<b>Preview mode.</b> In a live network this click fires the install API — '+
    '<code>FbPlayableAd.onCTAClick()</code>, <code>ExitApi.exit()</code>, '+
    '<code>dapi.openStoreUrl()</code> or <code>mraid.open(url)</code> — and the store page opens.';
  t.classList.add('show');
  clearTimeout(toastT); toastT=setTimeout(function(){t.classList.remove('show');},6500);
}
/* production CTA handler with per-network detection */
function ctaClick(){
  var url=STORE_URL;
  try{ if(window.FbPlayableAd&&window.FbPlayableAd.onCTAClick){window.FbPlayableAd.onCTAClick();return;} }catch(e){}
  try{ if(window.ExitApi&&window.ExitApi.exit){window.ExitApi.exit();return;} }catch(e){}
  try{ if(window.dapi&&window.dapi.openStoreUrl){window.dapi.openStoreUrl();return;} }catch(e){}
  try{ if(window.mraid&&window.mraid.open){window.mraid.open(url);return;} }catch(e){}
  showToast();
}
$('getBtn').addEventListener('click',ctaClick);
$('ctaBtn').addEventListener('click',ctaClick);
$('again').addEventListener('click',function(){ $('end').style.display='none'; startLevel(0); });

/* ============ input ============ */
var grabPin=-1, downX=0, downY=0, downT=0;
function pdown(e){
  initAudio();
  lastInteract=performance.now();
  if(mode==='splash'){ dismissSplash(); return; }
  if(mode!=='play'||phase!=='run') return;
  var w=toWorld(e.clientX,e.clientY);
  for(var i=0;i<pins.length;i++){ var p=pins[i]; if(!p.active||p.state==='out') continue;
    var hx=p.bx+p.dx*(p.off+6), hy=p.by+p.dy*(p.off+6);
    var dx=w.x-hx, dy=w.y-hy;
    if(dx*dx+dy*dy<34*34){ grabPin=i; p.grab=true; p.state='drag';
      downX=w.x; downY=w.y; downT=performance.now(); p.from=p.off; return; }
  }
}
function pmove(e){
  if(grabPin<0) return;
  var p=pins[grabPin]; if(!p.active) {grabPin=-1; return;}
  var w=toWorld(e.clientX,e.clientY);
  var proj=(w.x-downX)*p.dx+(w.y-downY)*p.dy;
  p.off=clamp(p.from+proj,0,p.len*.96);
  if(p.off>p.len*.52) commitPin(grabPin);
}
function pup(){
  if(grabPin<0) return;
  var p=pins[grabPin];
  if(p.active&&p.state==='drag'){
    var quick=performance.now()-downT<230&&p.off-p.from<10;
    if(quick){ commitPin(grabPin); }
    else { p.state='spring'; p.t0=performance.now(); p.from=p.off; springSnd(); }
  }
  grabPin=-1;
}
function commitPin(i){
  var p=pins[i]; if(!p.active||p.state==='out') return;
  p.state='out'; p.t0=performance.now(); p.from=p.off; p.hint=false;
  grabPin=-1; pinSnd(); shake=Math.max(shake,3);
  var hx=p.bx+p.dx*p.off, hy=p.by+p.dy*p.off;
  for(var s=0;s<10;s++){ var a=Math.random()*6.28;
    FX.push({x:hx,y:hy,vx:Math.cos(a)*(60+Math.random()*160),vy:Math.sin(a)*(60+Math.random()*160)-40,
             r:1+Math.random()*1.8,c:'#cfd8ea',life:.4+Math.random()*.2,t:0}); }
  lastInteract=performance.now();
}
window.addEventListener('pointerdown',pdown,{passive:true});
window.addEventListener('pointermove',pmove,{passive:true});
window.addEventListener('pointerup',pup,{passive:true});
window.addEventListener('pointercancel',pup,{passive:true});

var splashDone=false;
function dismissSplash(){ if(splashDone) return; splashDone=true;
  $('splash').classList.add('hide'); startLevel(0); }
setTimeout(dismissSplash,1400);

/* ============ physics ============ */
function collideSeg(p,ax,ay,bx,by,half){
  var dx=bx-ax, dy=by-ay, L2=dx*dx+dy*dy; if(L2===0) return;
  var t=((p.x-ax)*dx+(p.y-ay)*dy)/L2; t=t<0?0:(t>1?1:t);
  var cx0=ax+dx*t, cy0=ay+dy*t;
  var nx=p.x-cx0, ny=p.y-cy0, d2=nx*nx+ny*ny, R=p.r+half;
  if(d2>=R*R) return;
  var d=Math.sqrt(d2)||.0001; nx/=d; ny/=d;
  var pen=R-d; p.x+=nx*pen; p.y+=ny*pen;
  var vn=p.vx*nx+p.vy*ny;
  if(vn<0){ p.vx-=vn*1.1*nx; p.vy-=vn*1.1*ny; p.vx*=.985; p.vy*=.985; }
}
var gridMap=new Map();
function ppass(){
  gridMap.clear();
  var i,p,key;
  for(i=0;i<P.length;i++){ p=P[i];
    key=(((p.x+640)*0.111)|0)*4096+(((p.y+640)*0.111)|0);
    var arr=gridMap.get(key); if(!arr){arr=[];gridMap.set(key,arr);} arr.push(i);
  }
  for(i=0;i<P.length;i++){ p=P[i];
    var gx=((p.x+640)*0.111)|0, gy=((p.y+640)*0.111)|0;
    for(var ox=-1;ox<=1;ox++) for(var oy=-1;oy<=1;oy++){
      var cell=gridMap.get((gx+ox)*4096+(gy+oy)); if(!cell) continue;
      for(var k=0;k<cell.length;k++){ var j=cell[k]; if(j<=i) continue;
        var q=P[j];
        var dx=q.x-p.x, dy=q.y-p.y, rs=p.r+q.r, d2=dx*dx+dy*dy;
        if(d2>=rs*rs||d2===0) continue;
        var d=Math.sqrt(d2), pen=(rs-d)*.36, nx=dx/d, ny=dy/d;
        p.x-=nx*pen; p.y-=ny*pen; q.x+=nx*pen; q.y+=ny*pen;
        /* contamination */
        if(p.t!==q.t){ if(p.t===0)p.c=Math.min(1,p.c+.55); else q.c=Math.min(1,q.c+.55); }
        else if(p.t===0){
          if(p.c>.55&&q.c<p.c) q.c=Math.min(1,q.c+.01);
          else if(q.c>.55&&p.c<q.c) p.c=Math.min(1,p.c+.01);
        }
      }
    }
  }
}
function solids(){
  for(var i=0;i<P.length;i++){ var p=P[i];
    for(var wi=0;wi<walls.length;wi++){ var wl=walls[wi];
      collideSeg(p,wl.ax,wl.ay,wl.bx,wl.by,WALLT); }
    for(var pi=0;pi<pins.length;pi++){ var pn=pins[pi]; if(!pn.active) continue;
      collideSeg(p,pn.ax+pn.dx*pn.off,pn.ay+pn.dy*pn.off,
                   pn.bx+pn.dx*pn.off,pn.by+pn.dy*pn.off,PINT); }
  }
}
function physics(dt){
  var sub=4, h=dt/sub;
  for(var s=0;s<sub;s++){
    for(var i=0;i<P.length;i++){ var p=P[i];
      p.vy+=G*h; p.vx*=.999;
      if(p.vy>1200)p.vy=1200; if(p.vx>900)p.vx=900; if(p.vx<-900)p.vx=-900;
      p.x+=p.vx*h; p.y+=p.vy*h;
    }
    solids();
    ppass();
    solids();
  }
  /* sensors */
  var cx0=CHEST.x+6, cx1=CHEST.x+CHEST.w-6, cy0=CHEST.y+10;
  for(var n=P.length-1;n>=0;n--){ var q=P[n];
    if(q.y>cy0&&q.x>cx0&&q.x<cx1){
      if(phase==='run'&&(q.t===1||q.c>.5)){ triggerFail(); }
      else if(q.t===0){
        q.dead=true; collected++;
        if(phase==='run') collectSnd(collected);
        FX.push({x:q.x,y:CHEST.y+8,vx:(Math.random()-.5)*70,vy:-90-Math.random()*80,
                 r:1.4,c:'#ffe08a',life:.45,t:0});
        if(phase==='run'&&collected>=winNeed) triggerWin();
      } else q.dead=true;
    }
    else if(q.y>VH+80) q.dead=true;
  }
  var alive=[]; for(var a2=0;a2<P.length;a2++) if(!P[a2].dead) alive.push(P[a2]);
  P=alive;
  /* contamination fraction fail */
  if(phase==='run'&&li===1&&++contamCheck>18){ contamCheck=0;
    var bad=0,tot=0;
    for(var c2=0;c2<P.length;c2++){ if(P[c2].t===0){tot++; if(P[c2].c>.6)bad++;} }
    if(tot>0&&bad/goldTotal>.3) triggerFail();
  }
}
function triggerFail(){
  if(phase!=='run') return;
  phase='fail'; tsTarget=.45; vignRed=1; shake=9;
  showBanner('The gold is cursed!',true); failSnd();
  setTimeout(function(){ startLevel(li); },1500);
}
function triggerWin(){
  if(phase!=='run') return;
  phase='win'; tsTarget=.32; winSnd(); shake=4;
  for(var s=0;s<26;s++){ var a=Math.random()*6.28;
    FX.push({x:180,y:CHEST.y+6,vx:Math.cos(a)*(60+Math.random()*220),
             vy:-Math.abs(Math.sin(a))*(140+Math.random()*220),
             r:1.2+Math.random()*2,c:Math.random()<.5?'#ffe08a':'#f2b134',
             life:.6+Math.random()*.4,t:0}); }
  if(li===0) showBanner('Clean pull.',false);
  setTimeout(function(){ tsTarget=1; },500);
  setTimeout(function(){
    if(li+1<LEVELS.length) startLevel(li+1);
    else { mode='end'; $('end').style.display='flex'; }
  },1350);
}

/* ============ render ============ */
function drawWalls(){
  ctx.lineCap='round';
  var i,w;
  ctx.strokeStyle='#1c2440'; ctx.lineWidth=9;
  for(i=0;i<walls.length;i++){ w=walls[i];
    ctx.beginPath(); ctx.moveTo(w.ax,w.ay); ctx.lineTo(w.bx,w.by); ctx.stroke(); }
  ctx.strokeStyle='rgba(122,142,205,.22)'; ctx.lineWidth=2.6;
  for(i=0;i<walls.length;i++){ w=walls[i];
    ctx.beginPath(); ctx.moveTo(w.ax,w.ay); ctx.lineTo(w.bx,w.by); ctx.stroke(); }
}
function drawChest(){
  /* body */
  rr(ctx,CHEST.x,CHEST.y,CHEST.w,CHEST.h,9);
  ctx.fillStyle='#10162b'; ctx.fill();
  ctx.strokeStyle='#2b3557'; ctx.lineWidth=2; ctx.stroke();
  /* mouth glow */
  ctx.globalCompositeOperation='lighter';
  var g=ctx.createRadialGradient(180,CHEST.y+6,4,180,CHEST.y+6,44);
  g.addColorStop(0,'rgba(242,177,52,.28)'); g.addColorStop(1,'rgba(242,177,52,0)');
  ctx.fillStyle=g; ctx.beginPath(); ctx.arc(180,CHEST.y+6,44,0,6.283); ctx.fill();
  ctx.globalCompositeOperation='source-over';
  /* pile */
  var frac=goldTotal?collected/goldTotal:0;
  if(frac>0){ var ph2=Math.min(46,4+46*frac);
    rr(ctx,CHEST.x+8,CHEST.y+CHEST.h-6-ph2,CHEST.w-16,ph2,6);
    var pg=ctx.createLinearGradient(0,CHEST.y+CHEST.h-6-ph2,0,CHEST.y+CHEST.h-6);
    pg.addColorStop(0,'#ffe08a'); pg.addColorStop(1,'#c78617');
    ctx.fillStyle=pg; ctx.fill();
  }
  /* rim */
  ctx.strokeStyle='#d9a63f'; ctx.lineWidth=2.4;
  ctx.beginPath(); ctx.moveTo(CHEST.x,CHEST.y+2); ctx.lineTo(CHEST.x+16,CHEST.y+2);
  ctx.moveTo(CHEST.x+CHEST.w,CHEST.y+2); ctx.lineTo(CHEST.x+CHEST.w-16,CHEST.y+2); ctx.stroke();
  /* counter */
  ctx.fillStyle='rgba(232,236,245,.9)';
  ctx.font='700 13px "Space Grotesk",sans-serif';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(collected+' / '+winNeed,180,CHEST.y+CHEST.h+14>VH-6?VH-10:CHEST.y+CHEST.h-14);
}
function drawPins(now){
  for(var i=0;i<pins.length;i++){ var p=pins[i]; if(!p.active) continue;
    /* animate committed / spring */
    if(p.state==='out'){ var k=Math.min(1,(now-p.t0)/220), e=1-Math.pow(1-k,3);
      p.off=lerp(p.from,p.len*1.55,e);
      if(k>=1){ p.active=false; continue; } }
    else if(p.state==='spring'){ var k2=Math.min(1,(now-p.t0)/170);
      p.off=lerp(p.from,0,k2); if(k2>=1)p.state='in'; }
    var sx=p.ax+p.dx*p.off, sy=p.ay+p.dy*p.off,
        ex=p.bx+p.dx*p.off, ey=p.by+p.dy*p.off;
    var alpha=p.state==='out'?Math.max(0,1-(p.off-p.len*.7)/(p.len*.9)):1;
    ctx.globalAlpha=alpha;
    var nx=-p.dy, ny=p.dx;
    ctx.lineCap='round';
    ctx.strokeStyle='#6b7590'; ctx.lineWidth=8;
    ctx.beginPath(); ctx.moveTo(sx,sy); ctx.lineTo(ex,ey); ctx.stroke();
    ctx.strokeStyle='rgba(213,220,234,.85)'; ctx.lineWidth=2.4;
    ctx.beginPath(); ctx.moveTo(sx+nx*2,sy+ny*2); ctx.lineTo(ex+nx*2,ey+ny*2); ctx.stroke();
    /* handle ring */
    var hx=ex+p.dx*7, hy=ey+p.dy*7;
    if(p.hint){ ctx.save();
      ctx.shadowColor='rgba(242,177,52,.9)'; ctx.shadowBlur=16;
      ctx.strokeStyle='#f2b134'; ctx.lineWidth=4.4;
      ctx.beginPath(); ctx.arc(hx,hy,12,0,6.283); ctx.stroke(); ctx.restore();
      /* chevrons along pull dir */
      var wob=(now/500)%1;
      for(var c3=0;c3<3;c3++){ var d3=22+c3*13+wob*10;
        var cxp=hx+p.dx*d3, cyp=hy+p.dy*d3, s3=5.5;
        ctx.globalAlpha=alpha*(0.85-c3*.22)*(1-wob*.4);
        ctx.strokeStyle='#f2b134'; ctx.lineWidth=3; ctx.lineJoin='round';
        ctx.beginPath();
        ctx.moveTo(cxp-p.dx*s3+nx*s3, cyp-p.dy*s3+ny*s3);
        ctx.lineTo(cxp+p.dx*s3, cyp+p.dy*s3);
        ctx.lineTo(cxp-p.dx*s3-nx*s3, cyp-p.dy*s3-ny*s3);
        ctx.stroke();
      }
      ctx.globalAlpha=alpha;
    } else {
      ctx.strokeStyle='#8b94a8'; ctx.lineWidth=4;
      ctx.beginPath(); ctx.arc(hx,hy,11,0,6.283); ctx.stroke();
    }
    ctx.globalAlpha=1;
  }
}
function drawParticles(){
  for(var i=0;i<P.length;i++){ var p=P[i];
    var img = p.t===1 ? SPR_SLIME : SPR_GOLD[Math.min(5,Math.round(p.c*5))];
    var w=p.r*5.4;
    ctx.drawImage(img,p.x-w/2,p.y-w/2,w,w);
  }
}
function drawFX(dt){
  for(var i=FX.length-1;i>=0;i--){ var f=FX[i]; f.t+=dt;
    if(f.t>=f.life){ FX.splice(i,1); continue; }
    f.x+=f.vx*dt; f.y+=f.vy*dt; f.vy+=700*dt;
    var k=1-f.t/f.life;
    ctx.globalAlpha=k; ctx.fillStyle=f.c;
    ctx.beginPath(); ctx.arc(f.x,f.y,f.r*k+.4,0,6.283); ctx.fill();
  }
  ctx.globalAlpha=1;
}

var last=performance.now();
function frame(now){
  var rdt=Math.min(1/30,(now-last)/1000); last=now;
  TS+=(tsTarget-TS)*Math.min(1,rdt*8);
  var dt=rdt*TS;

  /* idle hint */
  if(mode==='play'&&phase==='run'&&now-lastInteract>6000){
    var corr=LEVELS[li].correct;
    for(var h2=0;h2<corr.length;h2++){ var cp=pins[corr[h2]];
      if(cp&&cp.active){ cp.hint=true; break; } }
  }
  if(mode==='play'&&(phase==='run'||phase==='win'||phase==='fail')) physics(dt);
  if(shake>0) shake=Math.max(0,shake-30*rdt);
  if(vignRed>0) vignRed=Math.max(0,vignRed-1.1*rdt);

  /* ---- background (screen space) ---- */
  var bg=ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#0b1122'); bg.addColorStop(.55,'#070b18'); bg.addColorStop(1,'#04060d');
  ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#9fb4e8';
  for(var m2=0;m2<motes.length;m2++){ var mo=motes[m2];
    mo.y-=mo.s*rdt/H; if(mo.y<-.02) mo.y=1.02;
    ctx.globalAlpha=.05+.05*Math.sin(now/1300+mo.p);
    ctx.beginPath(); ctx.arc(mo.x*W,mo.y*H,mo.r,0,6.283); ctx.fill(); }
  ctx.globalAlpha=1;

  /* ---- world ---- */
  ctx.save();
  ctx.translate(OX+(Math.random()-.5)*shake*SC, OY+(Math.random()-.5)*shake*SC);
  ctx.scale(SC,SC);
  drawWalls();
  drawChest();
  drawPins(now);
  drawParticles();
  drawFX(rdt);
  ctx.restore();

  /* ---- overlays ---- */
  if(vig) ctx.drawImage(vig,0,0);
  if(vignRed>0){ ctx.fillStyle='rgba(255,64,64,'+(.2*vignRed)+')'; ctx.fillRect(0,0,W,H); }

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
